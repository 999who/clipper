# Стиль субтитров «как в CapCut»: 1–3 слова, белый КАПС с чёрной обводкой,
# текущее слово жёлтое и «выпрыгивает».
#
# Свой стиль: скопируйте этот файл, например в D:\clips\my.yaml, поменяйте что
# нужно и укажите его: --style D:\clips\my.yaml (или subtitles.style в clipper.yaml).
# В своём файле можно оставить только изменённые строки — остальное возьмётся отсюда.
#
# Размеры — в пикселях кадра 1080×1920; для другого кадра они масштабируются.
# Цвета — "#RRGGBB" обязательно в кавычках (без них YAML считает # комментарием).

font: Montserrat Black      # имя шрифта; сначала ищется в clipper/fonts/, потом в системе
font_file: null             # свой файл шрифта (.ttf/.otf): путь от папки стиля или полный
size: 130                   # размер шрифта
bold: false                 # Montserrat Black и так жирный
uppercase: true             # КАПС
strip_punctuation: true     # без знаков препинания (дефис внутри слова остаётся)

color: "#FFFFFF"            # текст
highlight: "#FFE600"        # текущее слово
outline: 5                  # обводка, px
outline_color: "#000000"
shadow: 0                   # тень, px (0 — без тени)
shadow_color: "#000000"

position: 0.72              # центр строки по высоте кадра: 0 — верх, 1 — низ
margin: 60                  # отступ от боковых краёв, px

max_words: 3                # слов на экране (1–5)
max_chars: 16               # символов в строке; длиннее — новая строка
pause: 0.4                  # пауза в речи (с), после которой начинается новая строка
hold: 0.3                   # сколько строка держится после последнего слова, с

pop_from: 90                # анимация текущего слова: начальный масштаб, %
pop_peak: 112               # максимальный масштаб, %
pop_duration: 0.15          # длительность, с (0 — без анимации)
