# ──────────────────────────────────────────────────────────────────────────────
# Конфиг clipper.
#
# Приоритет: значения по умолчанию → этот файл → флаги командной строки.
# Чтобы поменять параметр, раскомментируйте его вместе с заголовком раздела
# и впишите своё значение. Итоговые параметры показывает команда: clipper config
# Любой параметр можно задать и разово: --set раздел.параметр=значение
# ──────────────────────────────────────────────────────────────────────────────

# Папки. Относительные пути считаются от папки, из которой запущен clipper.
# paths:
#   workdir: work            # рабочие папки видео: work/<id>/ (видео, кэш, project.json)
#   output: output           # готовые клипы: output/<id>/clip_01.mp4

# Этап 1 — загрузка.
# download:
#   max_height: 1080         # максимальная высота видео с YouTube, px
#   cookies_from_browser: null   # firefox — если YouTube просит войти («подтвердите, что вы не бот»);
#                                # из Chrome на Windows cookies прочитать нельзя

# Этап 2 — распознавание речи (faster-whisper large-v3 на видеокарте).
# transcribe:
#   language: auto           # auto — определить автоматически; или код языка: ru, en, uk…
#   compute_type: float16    # int8_float16 — если видеопамять занята игрой (~3 ГБ вместо ~4,5)
#   margin: 5                # запас вокруг фрагментов heatmap при распознавании, с
#   model_dir: null          # куда скачать модель (~3 ГБ); null — кэш HuggingFace
#   verbatim: false          # true — просить Whisper записывать «эм», «ээ» (нужно для remove_fillers);
#                            # влияет на распознавание: после смены распознаётся заново

# Этап 3 — выбор моментов.
# select:
#   mode: heatmap            # heatmap — «Самые популярные фрагменты» YouTube; keywords — по словам
#   keywords: []             # для mode: keywords, например [побед*, да ладно]; * — любое окончание
#   clips: 5                 # сколько клипов сделать
#   min_len: 20              # минимальная длина клипа, с
#   max_len: 60              # максимальная длина клипа, с

# Этап 4 — обработка звука.
# audio:
#   cut_pauses: false        # вырезать паузы
#   pause_detect: volume     # volume — по громкости (silence_db); words — по промежуткам между словами
#                            # (для стримов: из-за игры и музыки тишины почти не бывает)
#   silence_db: -35          # порог тишины, дБ: всё тише считается паузой
#   min_pause: 0.6           # вырезать паузы не короче этого, с
#   max_gap: 3.0             # для words: промежутки без слов длиннее этого не трогать (там смех,
#                            # крик или игра — Whisper их не записывает); 0 — резать все
#   remove_fillers: false    # убирать слова-паразиты
#   fillers: [эм, эмм, ээ, эээ, мм, ммм, хм, ну, как бы]   # можно добавить: типа, короче, в общем

# Этап 5 — субтитры.
# subtitles:
#   enabled: true
#   style: capcut            # стиль из clipper/styles/ или путь к своему .yaml (шрифт, цвета, размер…)
#   max_words: null          # слов на экране (1–5); null — как в стиле (3)

# Этап 6 — кадрирование.
# reframe:
#   mode: video              # video — обычное видео; stream — вебка сверху, игра снизу
#   aspect: 9:16             # 9:16 | 1:1 | original (1:1 и original вписываются в 1080×1920)
#   crop: face               # face — следить за лицом; center — кроп по центру
#   background: blur         # фон для 1:1 и original: blur — размытое видео, black — чёрный
#   layout: null             # пресет из layouts для режима stream (или флаг --layout)
#   detector: yunet          # детектор лиц для crop: face — yunet (OpenCV, находит и небольшие лица)
#                            # или mediapipe (BlazeFace: только крупные лица, как в селфи)

# Этапы 6–7 — рендер.
# render:
#   encoder: auto            # auto — NVENC, если работает, иначе libx264; nvenc | x264
#   thumbnails: true         # обложка clip_NN.jpg для каждого клипа
#   concat: false            # дополнительно склеить все клипы в один ролик

# Пресеты компоновки для режима stream: --mode stream --layout my_setup
# Координаты вебки — в пикселях исходного кадра. Снять их удобно по кадру
# с сеткой: clipper calibrate ВИДЕО --at 1:30.
layouts:
  my_setup:
    source_size: [1920, 1080]   # разрешение кадра, по которому сняты координаты
    webcam: { x: 1560, y: 810, width: 360, height: 270 }
    webcam_zone: 0.33           # доля высоты кадра под вебку сверху
    game_crop: center           # center | left | right
